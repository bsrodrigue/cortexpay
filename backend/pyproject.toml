[project]
name = "cortexcard-backend"
version = "0.1.0"
description = "CortexPay MVP - Double-Entry Ledger, FX Engine & Payment Gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.8",
    "psycopg[binary]>=3.2.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
