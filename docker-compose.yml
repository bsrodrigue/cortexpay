services:
  postgres:
    image: postgres:16-alpine
    container_name: cortex_postgres
    restart: always
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex_secret_password
      POSTGRES_DB: cortex_pay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex_pay"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cortex_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cortex_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://cortex:cortex_secret_password@postgres:5432/cortex_pay
      REDIS_URL: redis://redis:6379/0
      FX_QUOTE_TTL_SECONDS: 90
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cortex_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
